name: Unit Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: jdx/mise-action@v5
    - name: Install modules
      run: npm install
    - name: Run tests
      id: tests
      run: |
        set -o pipefail
        npm run test:coverage | tee "$RUNNER_TEMP/jest-output.txt"
    - name: Coverage summary
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      run: |
        {
          echo '### Unit test coverage'
          echo '```text'
          sed -n '/ Coverage summary /,/^=*$/p' "$RUNNER_TEMP/jest-output.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30
